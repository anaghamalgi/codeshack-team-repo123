spring.application.name=smartcalc-backend
server.port=8080

# Update these values for your local MySQL setup, or set them as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartcalc?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
